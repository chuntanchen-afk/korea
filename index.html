<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>2026 釜山 6天5夜｜可摺疊 DAY＋Google 地圖＋NAVER 導航</title>
<style>
:root{
  --bg:#0b0f14; --card:#111826; --card2:#0f1723; --text:#e8eef6; --muted:#a8b3c7;
  --line:#1f2a3d; --chip:#16233a; --accent:#7dd3fc; --accent2:#a78bfa;
  --ok:#86efac; --warn:#fde047;
}
*{box-sizing:border-box}
body{margin:0;font-family: ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;background:radial-gradient(1200px 600px at 20% 0%, #132038 0%, var(--bg) 55%);color:var(--text)}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg, rgba(11,15,20,.92), rgba(11,15,20,.72));backdrop-filter: blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.h1{font-weight:800;letter-spacing:.3px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{padding:6px 10px;border:1px solid var(--line);background:rgba(17,24,38,.65);border-radius:999px;color:var(--muted);font-size:12px}
.badge strong{color:var(--text)}
.main{display:grid;grid-template-columns: 1.05fr .95fr;gap:14px;align-items:start}
@media (max-width: 980px){.main{grid-template-columns:1fr}}
.panel{background:rgba(17,24,38,.72);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.panel-hd{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:8px}
.tab{border:1px solid var(--line);background:rgba(15,23,35,.6);color:var(--muted);padding:8px 10px;border-radius:12px;font-size:13px;cursor:pointer;user-select:none}
.tab.active{background:linear-gradient(135deg, rgba(125,211,252,.18), rgba(167,139,250,.12));color:var(--text);border-color:rgba(125,211,252,.35)}
.panel-bd{padding:12px 12px 14px}
.mapWrap{position:sticky;top:74px}
@media (max-width:980px){.mapWrap{position:relative;top:auto}}
.mapCard{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:rgba(17,24,38,.72);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mapHd{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mapHd .small{font-size:12px;color:var(--muted)}
.mapTools{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(15,23,35,.6);color:var(--text);cursor:pointer;font-size:13px}
.btn:hover{border-color:rgba(125,211,252,.35)}
.iframe{width:100%;height:520px;border:0;display:block;background:#0a0f15}
@media (max-width:980px){.iframe{height:440px}}
.fxGrid{display:grid;grid-template-columns:1fr;gap:12px}
.fxBox{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(15,23,35,.6)}
.fxRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.fxRow{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted)}
input{width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(9,13,19,.75);color:var(--text);outline:none}
input:focus{border-color:rgba(125,211,252,.45)}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.kpi .pill{padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(22,35,58,.55);font-size:12px;color:var(--muted)}
.kpi .pill strong{color:var(--text)}
details{border:1px solid var(--line);border-radius:16px;background:rgba(15,23,35,.55);overflow:hidden}
details+details{margin-top:10px}
summary{list-style:none;cursor:pointer;padding:14px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
.sumL{display:flex;flex-direction:column;gap:2px}
.sumTitle{font-weight:800}
.sumSub{font-size:12px;color:var(--muted)}
.chev{transition:transform .2s ease;opacity:.9}
details[open] .chev{transform:rotate(180deg)}
.dayBody{padding:0 12px 12px}
.flight{margin:10px 0 0;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg, rgba(125,211,252,.14), rgba(167,139,250,.10));border:1px solid rgba(125,211,252,.25);color:var(--text);font-size:13px}
.stay{margin:10px 0 12px;padding:10px 12px;border-radius:14px;background:rgba(17,24,38,.7);border:1px dashed rgba(168,179,199,.25);color:var(--muted);font-size:13px}

.time{font-weight:800;color:var(--accent)}
.title{font-weight:800}
.desc{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}
.actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}

.chip.secondary{color:var(--muted)}
.chip:hover{border-color:rgba(125,211,252,.35)}
.footer{color:var(--muted);font-size:12px;margin:14px 0 0;line-height:1.6}
.notice{color:var(--muted);font-size:12px}
</style>
</head>

<header>
  <div class="wrap">
    <div class="topbar">
      <div class="h1">2026 釜山 6天5夜｜可摺疊 DAY＋Google 地圖＋NAVER 導航</div>
      <div class="badges">
        <div class="badge"><strong>點行程卡片</strong> → 右側 Google 地圖定位</div>
        <div class="badge"><strong>NAVER 導航</strong>：可直接開 App（若裝置支援）</div>
        <div class="badge">匯率：<strong>KRW ⇄ TWD</strong></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="main">

    <section class="panel" id="leftPanel">
      <div class="panel-hd">
        <div class="tabs">
          <div class="tab active" data-tab="plan">行程</div>
          <div class="tab" data-tab="fx">匯率換算</div>
        </div>
        <div class="notice">小提醒：如果手機內嵌地圖空白，請改用「在 Google Maps 開啟」按鈕。</div>
      </div>

      <div class="panel-bd" id="tab-plan">
        
      </div>

      <div class="panel-bd" id="tab-fx" style="display:none">
        <div class="fxGrid">
          <div class="fxBox">
            <div class="fxRow">
              <div>
                <label>韓元 KRW</label>
                <input id="krw" inputmode="decimal" placeholder="例如 10000"/>
              </div>
              <div>
                <label>台幣 TWD</label>
                <input id="twd" inputmode="decimal" placeholder="例如 250"/>
              </div>
            </div>
            <div class="fxRow" style="margin-top:10px">
              <div>
                <label>匯率（1 KRW = ? TWD）</label>
                <input id="rate" inputmode="decimal" placeholder="例如 0.024" />
              </div>
              <div>
                <label>快速倍率（可選）</label>
                <input id="mult" inputmode="decimal" placeholder="例如 10（一起買 10 份）"/>
              </div>
            </div>
            <div class="kpi" id="fxKpi"></div>
            <div class="footer">
              你可以只填其中一邊金額 + 匯率，另一邊會自動算出。匯率請以你當天換匯/刷卡實際為準。
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="mapWrap">
      <div class="mapCard">
        <div class="mapHd">
          <div>
            <div style="font-weight:800">地圖</div>
            <div class="small" id="mapSubtitle">尚未選擇地點</div>
          </div>
          <div class="mapTools">
            <button class="btn" id="btnOpenGoogle">在 Google Maps 開啟</button>
            <button class="btn" id="btnNaverRoute">NAVER 導航</button>
          </div>
        </div>
        <iframe class="iframe" id="gmap" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="about:blank"></iframe>
      </div>
      <div class="footer">
        NAVER 導航深連結在不同手機/版本上支援度不一：若無法直接進入「目的地導航」，此頁會自動退回到 NAVER 搜尋結果（至少能一鍵定位到目的地）。
      </div>
    </aside>

  </div>
</div>

const state = {
  current: null, // {q, title, lat, lng}
};

function enc(s){ return encodeURIComponent(s || ""); }

function googleEmbedUrl(q, lat, lng){
  // 不用 API key，手機也相對穩定
  if (lat && lng) return `https://www.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
  return `https://www.google.com/maps?q=${enc(q)}&z=15&output=embed`;
}

function googleOpenUrl(q, lat, lng){
  if (lat && lng) return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  return `https://www.google.com/maps/search/?api=1&query=${enc(q)}`;
}

function naverRouteUrl(q, lat, lng){
  // 優先：直接進導航（destination）
  if (lat && lng) {
    const dname = enc(q);
    // 嘗試多種 scheme：部分機型只吃其中一種
    return {
      app: `nmap://route/car?dlat=${lat}&dlng=${lng}&dname=${dname}&appname=trip.plan`,
      web: `https://map.naver.com/v5/directions/-/-/${lng},${lat},${dname}?c=${lng},${lat},15,0,0,0,dh`
    };
  }
  // 沒座標：退回搜尋
  const qq = enc(q);
  return {
    app: `nmap://search?query=${qq}&appname=trip.plan`,
    web: `https://map.naver.com/v5/search/${qq}`
  };
}

function setMap(target){
  state.current = target;
  const iframe = document.getElementById("gmap");
  iframe.src = googleEmbedUrl(target.q, target.lat, target.lng);
  document.getElementById("mapSubtitle").textContent = target.title || target.q || "已定位";
}

function tryOpen(url){
  // 用 iframe 觸發 app scheme（iOS/Android 兼容性較好）
  const i = document.createElement('iframe');
  i.style.display = 'none';
  i.src = url;
  document.body.appendChild(i);
  setTimeout(() => i.remove(), 1200);
}

function openNaver(){
  if(!state.current) return alert("請先點選一個行程地點");
  const u = naverRouteUrl(state.current.q, state.current.lat, state.current.lng);
  // 先試 App，失敗就落到 Web
  const t0 = Date.now();
  tryOpen(u.app);
  setTimeout(() => {
    // 仍在本頁（很可能 app 沒打開）→ 用網頁打開
    // 這個判斷不可能 100% 準，但夠實用
    if (Date.now() - t0 > 900) window.open(u.web, "_blank");
  }, 950);
}

function openGoogle(){
  if(!state.current) return alert("請先點選一個行程地點");
  window.open(googleOpenUrl(state.current.q, state.current.lat, state.current.lng), "_blank");
}

function renderPlan(){
  const root = document.getElementById("tab-plan");
  root.innerHTML = "";
  DAYS.forEach((d, di) => {
    const det = document.createElement("details");
    if(di===0) det.open = true;
    const sum = document.createElement("summary");
    sum.innerHTML = `
      <div class="sumL">
        <div class="sumTitle">${d.day}</div>
        <div class="sumSub">住宿：${d.stay || "—"}</div>
      </div>
      <div class="chev">▾</div>
    `;
    det.appendChild(sum);

    const body = document.createElement("div");
    body.className = "dayBody";

    if(d.flight){
      const f = document.createElement("div");
      f.className = "flight";
      f.textContent = d.flight;
      body.appendChild(f);
    }

    if(d.stay){
      const s = document.createElement("div");
      s.className = "stay";
      s.textContent = `住宿：${d.stay}`;
      body.appendChild(s);
    }

    d.items.forEach((it) => {
      const card = document.createElement("div");
      card.className = "item";
      card.innerHTML = `
        <div class="time">${it.time}</div>
        <div>
          <div class="title">${it.title}</div>
          ${it.desc ? `<div class="desc">${it.desc}</div>` : ""}
          <div class="actions">
            <button class="chip" data-act="focus">地圖定位</button>
            <button class="chip" data-act="naver">NAVER 導航</button>
            <button class="chip secondary" data-act="google">Google Maps</button>
          </div>
        </div>
      `;
      const target = {q: it.q || it.title, title: it.title, lat: it.lat, lng: it.lng};
      card.addEventListener("click", (e) => {
        // 點卡片任何地方都定位（除了按鈕會另外處理）
        if(e.target?.dataset?.act) return;
        setMap(target);
      });
      card.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          setMap(target);
          const act = btn.dataset.act;
          if(act==="naver") openNaver();
          if(act==="google") openGoogle();
        });
      });
      body.appendChild(card);
    });

    det.appendChild(body);
    root.appendChild(det);
  });
}

function fxInit(){
  const krw = document.getElementById("krw");
  const twd = document.getElementById("twd");
  const rate = document.getElementById("rate");
  const mult = document.getElementById("mult");
  const kpi = document.getElementById("fxKpi");

  function num(v) {
    const n = parseFloat(String(v||"").replace(/,/g,""));
    return Number.isFinite(n) ? n : null;
  }

  function renderKpi(r, k, t, m){
    kpi.innerHTML = "";
    const pill = (label, value) => {
      const d = document.createElement("div");
      d.className = "pill";
      d.innerHTML = `${label} <strong>${value}</strong>`;
      kpi.appendChild(d);
    };
    if(r!=null) pill("匯率", `1 KRW = ${r.toFixed(6)} TWD`);
    if(k!=null) pill("KRW", k.toLocaleString());
    if(t!=null) pill("TWD", t.toLocaleString(undefined, {maximumFractionDigits:2}));
    if(m!=null && k!=null && t!=null) {
      pill("× 倍率", m.toLocaleString());
      pill("總 KRW", (k*m).toLocaleString());
      pill("總 TWD", (t*m).toLocaleString(undefined, {maximumFractionDigits:2}));
    }
  }

  function calc(){
    const r = num(rate.value);
    let k = num(krw.value);
    let t = num(twd.value);
    const m = num(mult.value);

    if(r!=null){
      if(k!=null && t==null) t = k * r;
      if(t!=null && k==null && r>0) k = t / r;
    }

    renderKpi(r, k, t, m);
    // 只在使用者有輸入時才回填，避免跳動感太重
    if(r!=null && k!=null && document.activeElement!==twd) twd.value = (t!=null? t.toFixed(2):"");
    if(r!=null && t!=null && document.activeElement!==krw) krw.value = (k!=null? k.toFixed(0):"");
  }

  ["input","change"].forEach(ev => {
    krw.addEventListener(ev, calc);
    twd.addEventListener(ev, calc);
    rate.addEventListener(ev, calc);
    mult.addEventListener(ev, calc);
  });

  // default: 給一個常見刷卡匯率區間提示（不強塞）
  renderKpi(null, null, null, null);
}

function initTabs(){
  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
      const name = t.dataset.tab;
      document.getElementById("tab-plan").style.display = name==="plan" ? "" : "none";
      document.getElementById("tab-fx").style.display = name==="fx" ? "" : "none";
    });
  });
}

document.getElementById("btnOpenGoogle").addEventListener("click", openGoogle);
document.getElementById("btnNaverRoute").addEventListener("click", () => {
  if(!state.current) {
    alert("請先點選一個行程地點");
    return;
  }
  openNaver();
});

renderPlan();
initTabs();
fxInit();

// 預設先定位到第一個點
setMap({q:DAYS[0].items[0].q, title:DAYS[0].items[0].title, lat:DAYS[0].items[0].lat, lng:DAYS[0].items[0].lng});
</script>
